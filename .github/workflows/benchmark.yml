name: Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark.yml"
      - "scripts/hpy-benchmark-matrix.sh"
      - "scripts/hpy_benchmark_matrix.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: HPy ${{ matrix.abi }} benchmark
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [cpython, universal]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools setuptools-scm "hpy>=0.9,<0.10"

      - name: Benchmark
        run: ./scripts/hpy-benchmark-matrix.sh ${{ matrix.abi }} --repeat 9 --min-time 0.10
        env:
          PYTHON: python
