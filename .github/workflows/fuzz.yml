name: Fuzz

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  hpy-fuzz:
    name: HPy ${{ matrix.abi }} smoke fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [cpython, universal]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -U setuptools setuptools-scm "hpy>=0.9,<0.10"
      - name: Build HPy artifact
        run: ./scripts/hpy-build.sh ${{ matrix.abi }}
        env:
          CFLAGS: '-DDEBUG'
          PYTHON: python

      - name: Fuzz encoder and decoder
        run: |
          python tests/fuzz.py --module ujson_hpy --seed=0:1000
          python tests/fuzz_decode.py --module ujson_hpy --seed=0:5000
        env:
          PYTHONPATH: build/hpy-${{ matrix.abi }}/lib

      - name: Fuzz Universal ABI with HPy debug handles
        if: matrix.abi == 'universal'
        run: |
          python tests/fuzz.py --module ujson_hpy --seed=0:250
          python tests/fuzz_decode.py --module ujson_hpy --seed=0:1000
        env:
          HPY: debug
          PYTHONPATH: build/hpy-universal/lib
