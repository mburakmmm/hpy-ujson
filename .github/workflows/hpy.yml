name: HPy

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.abi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
        abi: [cpython, universal]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test dependencies
        run: >-
          python -m pip install --upgrade pip pytest setuptools setuptools-scm
          "hpy>=0.9,<0.10"
      - name: Run HPy tests
        run: ./scripts/hpy-test.sh ${{ matrix.abi }}
        env:
          PYTHON: python
      - name: Validate isolated artifact
        run: >-
          python scripts/hpy_external_smoke.py
          --expected-abi ${{ matrix.abi }}
        env:
          PYTHONPATH: build/hpy-${{ matrix.abi }}/lib

  debug:
    name: Universal debug handles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test dependencies
        run: >-
          python -m pip install --upgrade pip pytest setuptools setuptools-scm
          "hpy>=0.9,<0.10"
      - name: Run Universal ABI tests with HPy debug handles
        run: ./scripts/hpy-test.sh universal
        env:
          HPY: debug
          PYTHON: python
      - name: Validate debug-mode artifact
        run: python scripts/hpy_external_smoke.py --expected-abi universal
        env:
          HPY: debug
          PYTHONPATH: build/hpy-universal/lib

  package:
    name: Distribution contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and inspect distributions
        run: ./scripts/check-package.sh
        env:
          PYTHON: python

  success:
    name: HPy successful
    needs: [test, debug, package]
    runs-on: ubuntu-latest
    steps:
      - run: echo "HPy validation successful"
