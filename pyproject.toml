[build-system]
requires = [
  "hpy>=0.9,<0.10",
  "setuptools>=80",
  "setuptools-scm[simple]>=9.2",
]

[project]
name = "hpy-ujson"
description = "HPy port of UltraJSON for CPython and Universal ABI hosts"
readme = "README.md"
license = "BSD-3-Clause AND TCL"
license-files = [ "LICENSE.txt" ]
maintainers = [
  { name = "Melih Burak Memis" },
]
authors = [
  { name = "Jonas Tarnstrom" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: C",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = [ "version" ]
urls.Changelog = "https://github.com/mburakmmm/hpy-ujson/releases"
urls.Homepage = "https://github.com/mburakmmm/hpy-ujson"
urls.Issues = "https://github.com/mburakmmm/hpy-ujson/issues"
urls.Source = "https://github.com/mburakmmm/hpy-ujson"

[tool.setuptools]
packages = []

[tool.black]
target-version = [ "py310", "py311", "py312", "py313", "py314" ]

[tool.isort]
profile = "black"
known_first_party = [ "ujson", "ujson_hpy" ]

[tool.pytest]
markers = [ "skip_leak_test: Don't rerun this test in search for memory leaks" ]
minversion = "9.0"
testpaths = [ "tests" ]
